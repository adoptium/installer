# .grype-ubuntu.yaml — Grype config for Ubuntu/Debian DEB content scanning
# Used by grype-linux-scan.sh when distro matches ubuntu:* or debian:*

distro: 'ubuntu:24.04'

output:
  - table
file: ''
pretty: false
sort-by: 'risk'
by-cve: true

fail-on-severity: 'high'

add-cpes-if-none: true

match:
  jvm:
    using-cpes: true      # match JVM vulnerabilities via CPE against NVD/Oracle advisories
  java:
    using-cpes: false
  golang:
    using-cpes: false
  python:
    using-cpes: false
  javascript:
    using-cpes: false
  dotnet:
    using-cpes: false

search:
  scope: 'squashed'
  indexed-archives: true
  unindexed-archives: false

# ── Ignore rules ──────────────────────────────────────────────────────────────
# Suppress known-accepted findings. Full schema:
#   - vulnerability: CVE-YYYY-NNNNN
#     package:
#       name: <name or regex>
#       type: deb
#     reason: '<justification>'
ignore:
  # Example:
  # - vulnerability: CVE-2023-4911
  #   package:
  #     name: glibc
  #     type: deb
  #   reason: 'GLIBC_TUNABLES not exposed in our deployment; reviewed 2025-01-15'

alerts:
  enable-eol-distro-warnings: true

db:
  cache-dir: '~/.cache/grype/db'
  update-url: 'https://grype.anchore.io/databases'
  auto-update: true
  validate-by-hash-on-start: true
  validate-age: true
  max-allowed-built-age: '120h'
  require-update-check: false

log:
  quiet: false
  level: 'warn'

show-suppressed: false
