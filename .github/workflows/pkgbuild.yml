name: macOS
on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - .github/workflows/pkgbuild.yml
      - pkgbuild/**
      - test/functional/pkgbuild/**
permissions:
  contents: read
jobs:
  resolve-latest-releases:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve latest LTS packages from the Adoptium API
        id: resolve
        run: |
          MATRIX="$(python3 pkgbuild/resolve_latest_mac_matrix.py)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test native packaging and API matrix generation
        run: |
          bash test/functional/pkgbuild/runInstallerTests.sh
          bash test/functional/pkgbuild/testUpgradeDowngrade.sh
          PYTHONPATH=. python3 -m unittest discover \
            -s test/functional/pkgbuild -p 'test_*.py'

  pkgbuild:
    needs: [resolve-latest-releases, test]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.resolve-latest-releases.outputs.matrix) }}
    name: "macOS ${{ matrix.major_version }} ${{ matrix.architecture }} ${{ matrix.image_type }}"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download latest Temurin archive
        env:
          ARCHIVE_URL: ${{ matrix.archive_url }}
          ARCHIVE_NAME: ${{ matrix.archive_name }}
          ARCHIVE_SHA256: ${{ matrix.archive_sha256 }}
        run: |
          mkdir -p workspace/target
          curl --fail --location --retry 3 \
            "$ARCHIVE_URL" \
            --output "workspace/target/$ARCHIVE_NAME"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "workspace/target/$ARCHIVE_NAME" \
            | shasum -a 256 -c
      - name: Build unsigned installer for Eclipse signing service
        env:
          WORKSPACE: ${{ github.workspace }}
          MAJOR_VERSION: ${{ matrix.major_version }}
          FULL_VERSION: ${{ matrix.full_version }}
        run: bash pkgbuild/create-installer-mac.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS-${{ matrix.major_version }}-${{ matrix.architecture }}-${{ matrix.image_type }}
          path: workspace/target/*.pkg
